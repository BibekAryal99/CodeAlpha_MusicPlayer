<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="music-player">
        <h1>Music Player</h1>

        <!-- Song cover/artwork -->
        <div class="album-art">
            <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=500&q=80"
                alt="Album Art" id="cover">
        </div>

        <!-- Song info -->
        <div class="song-info">
            <h2 id="title">Song Title</h2>
            <p id="artist">Artist Name</p>
        </div>

        <!-- Progress bar -->
        <div class="progress-container">
            <span id="current-time">0:00</span>
            <input type="range" id="progress" min="0" value="0">
            <span id="duration">0:00</span>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="prev" class="control-btn">
                <i class="fas fa-step-backward">⏮</i>
            </button>
            <button id="play" class="control-btn play-btn">
                <i class="fas fa-play">▶</i>
            </button>
            <button id="next" class="control-btn">
                <i class="fas fa-step-forward">⏭</i>
            </button>
        </div>

        <!-- Volume control -->
        <div class="volume-container">
            <span>🔈</span>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
            <span>🔊</span>
        </div>

        <!-- Playlist -->
        <div class="playlist">
            <h3>Playlist</h3>
            <ul id="playlist-songs">
                <!-- Playlist items will be added here dynamically -->
            </ul>
        </div>
    </div>

    <!-- Hidden audio element -->
    <audio id="audio" preload="metadata"></audio>

    <script src="script.js"></script>
</body>

</html>
